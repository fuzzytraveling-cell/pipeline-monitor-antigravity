<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- 中英切換:這一頁的字是中文;伺服器照語言設定送(server.mjs 的 pageIn),英文的時候把有 data-en 的那幾個換成 data-en 寫的。
     舊的服務(合併之後、還沒重啟)不認得 data-en,直接送這個檔——舊的服務只會中文,所以這裡寫的是中文。 -->
<title data-en="Pipeline Monitor · Antigravity">產線監視器 · Antigravity</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/ui.css">
</head>
<body>
<header>
  <h1 class="serif" data-en="Pipeline Monitor">產線監視器</h1>
  <span class="brand-badge">Antigravity</span>
  <nav id="crumb" class="crumb"></nav>
  <span class="spacer"></span>
  <!-- ⚠️ AC-1:這一列必須永遠在畫面上,而且秒數自己會跳。
       終端機天生誠實(你剛打完指令);網頁不會,除非它一直自己承認。 -->
  <span id="freshness" data-state="unknown" data-en="Connecting…">正在連線…</span>
  <!-- 中英切換的按鈕:寫成要切過去的那一種,看不懂現在這一種的人也找得到。按了之後怎樣(連不上、服務還在跑舊的程式…)寫在旁邊那一格 -->
  <button id="lang-switch" class="mini-btn" data-lang-switch data-en="中文">English</button>
  <span id="lang-note" class="lang-note"></span>
</header>
<main id="app"><p class="muted" data-en="Loading…">載入中…</p></main>
<script type="module" src="/app.js"></script>
</body>
</html>
