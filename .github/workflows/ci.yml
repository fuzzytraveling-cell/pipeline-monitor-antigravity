# ⚠️ 這支存在的唯一理由,是讓 docsIndex.test.mjs 從「紀律」變成「機制」。
# 沒有它,那支測試只有在有人記得跑的時候才有用——而人不會記得。
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # ⚠️ 「不准依賴 TutorPod」的檢查刻意**不寫在這裡**,而是 scripts/independence.test.mjs。
      #    寫在 YAML 裡的檢查只有 CI 會跑,第一次紅一定是在你人已經走了之後——
      #    而它為了完全正當的理由紅了兩次(LESSONS L10)。搬進 npm test 才能在本機先紅。
      - name: 全部檢查(文件索引 / 誠實不變條件 / 隱私 / 獨立性)
        run: npm test
      - name: hook.sh 語法
        run: sh -n hook.sh
